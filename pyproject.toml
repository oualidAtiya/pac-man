[project]
name = "pac-man"
version = "0.1.0"
description = "this is a clone of pac-man game"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "mazegenerator",
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0"
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }
